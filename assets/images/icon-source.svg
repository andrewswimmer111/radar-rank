  </g>

  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round">
    <line x1="512" y1="512" x2="512" y2="162"/>
    <line x1="512" y1="512" x2="845" y2="404"/>
    <line x1="512" y1="512" x2="718" y2="795"/>
    <line x1="512" y1="512" x2="306" y2="795"/>
    <line x1="512" y1="512" x2="179" y2="404"/>
